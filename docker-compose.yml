services:
  postgres:
    image: postgres:18
    container_name: credit-risk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_risk
      POSTGRES_USER: credit_risk_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_risk_dev}
    ports:
      - "5434:5432"
    volumes:
      - credit_risk_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_risk_app -d credit_risk"]
      interval: 5s
      timeout: 3s
      retries: 15
  kafka:
    image: apache/kafka:4.1.1
    container_name: credit-risk-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - credit_risk_kafka:/var/lib/kafka/data
volumes:
  credit_risk_postgres:
  credit_risk_kafka:
