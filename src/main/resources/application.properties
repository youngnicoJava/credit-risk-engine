quarkus.application.name=credit-risk-engine
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8082}
quarkus.http.limits.max-body-size=64K
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:credit_risk_app}
quarkus.datasource.password=${DB_PASSWORD:credit_risk_dev}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5434/credit_risk}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:10}
quarkus.datasource.health.enabled=true
%test.quarkus.oidc.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
%dev.quarkus.keycloak.devservices.enabled=true
%dev.quarkus.keycloak.devservices.port=8181
%dev.quarkus.keycloak.devservices.service-name=credit-risk-keycloak
%dev.quarkus.keycloak.devservices.realm-path=keycloak/credit-risk-realm.json
%dev.quarkus.http.auth.permission.api.paths=/api/*
%dev.quarkus.http.auth.permission.api.policy=authenticated
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=metrics
quarkus.otel.enabled=true
%dev.quarkus.observability.enabled=false
quarkus.otel.service.name=${OTEL_SERVICE_NAME:credit-risk-engine}
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORTER_OTLP_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.log.console.json.additional-field.service.value=credit-risk-engine
quarkus.log.level=INFO
quarkus.smallrye-openapi.info-title=Credit Risk Engine API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.http.auth.permission.api.paths=/api/*
%prod.quarkus.http.auth.permission.api.policy=authenticated
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Correlation-ID
quarkus.http.cors.exposed-headers=X-Correlation-ID
%prod.quarkus.http.cors.origins=${FRONTEND_ORIGIN}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
risk.kafka.enabled=${RISK_KAFKA_ENABLED:false}
mp.messaging.incoming.risk-assessment-requests.connector=smallrye-kafka
mp.messaging.incoming.risk-assessment-requests.topic=loan.risk-assessment.requested.v2
mp.messaging.incoming.risk-assessment-requests.group.id=credit-risk-engine
mp.messaging.incoming.risk-assessment-requests.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.risk-assessment-requests.auto.offset.reset=earliest
mp.messaging.incoming.risk-assessment-requests.failure-strategy=dead-letter-queue
mp.messaging.incoming.risk-assessment-requests.dead-letter-queue.topic=loan.risk-assessment.requested.v2.DLQ
mp.messaging.incoming.risk-assessment-requests.enabled=${RISK_KAFKA_ENABLED:false}
mp.messaging.outgoing.risk-assessment-results.connector=smallrye-kafka
mp.messaging.outgoing.risk-assessment-results.topic=credit-risk.assessment.completed.v2
mp.messaging.outgoing.risk-assessment-results.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.risk-assessment-results.enabled=${RISK_KAFKA_ENABLED:false}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-topic-verification-enabled=true
%test.quarkus.scheduler.enabled=false
%test.mp.messaging.incoming.risk-assessment-requests.enabled=false
%test.mp.messaging.outgoing.risk-assessment-results.enabled=false
%test.quarkus.otel.exporter.otlp.enabled=false
%prod.quarkus.log.console.json.enabled=true
